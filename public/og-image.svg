<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mangoGlow" cx="50%" cy="32%">
      <stop offset="0%" style="stop-color:#e87a1e;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#e87a1e;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Cream background -->
  <rect width="1200" height="630" fill="#f5f1e3"/>

  <!-- Subtle mango glow -->
  <circle cx="600" cy="170" r="380" fill="url(#mangoGlow)"/>

  <!-- H monogram badge (forest green) -->
  <circle cx="600" cy="220" r="56" fill="#0f2419"/>
  <text x="595" y="241" text-anchor="middle"
        font-family="'Inter Tight', system-ui, -apple-system, sans-serif"
        font-size="62" font-weight="700" letter-spacing="-2.5"
        fill="#f5f1e3">H</text>

  <!-- Hula. wordmark (sans, forest ink + mango period) -->
  <text x="600" y="400" text-anchor="middle"
        font-family="'Inter Tight', system-ui, -apple-system, sans-serif"
        font-size="128" font-weight="600" letter-spacing="-5"
        fill="#0f2419">Hula<tspan fill="#e87a1e">.</tspan></text>

  <!-- Tagline -->
  <text x="600" y="468" text-anchor="middle"
        font-family="'Inter Tight', Inter, -apple-system, sans-serif"
        font-size="28" font-weight="500" letter-spacing="-0.3"
        fill="#5a6a60">The market for what happens next.</text>
</svg>
